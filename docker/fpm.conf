[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; Menjalankan sebagai www-data (sudah dipakai oleh Dockerfile).
user = www-data
group = www-data

; Soket unix lebih cepat daripada TCP untuk komunikasi nginx lokal.
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Log akses & error lambat untuk debugging produksi.
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

; ENV dari `docker run -e` harus bisa dibaca oleh PHP.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
